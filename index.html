<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tatiana Kalli - Нотариальные и юридические услуги</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
    <style>
        /* Настройки заднего фона */
        .bg-custom {
            background-image: url('image_e68527.jpg'); /* Ваше фоновое изображение */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
    </style>
</head>
<body class="bg-custom min-h-screen flex items-center justify-center p-4">
    <!-- Полупрозрачное затемнение фона, чтобы визитка читалась лучше -->
    <div class="fixed inset-0 bg-black/60 z-0"></div>

    <!-- Сама карточка визитки -->
    <div class="relative z-10 bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden">
        
        <!-- Кнопка переключения языка -->
        <div class="p-4 flex justify-end bg-gray-50 border-b">
            <button id="langToggle" class="px-4 py-1 bg-blue-600 text-white rounded-full text-sm font-semibold hover:bg-blue-700 transition shadow">RU / EN</button>
        </div>
        
        <div class="p-6 text-center">
            <!-- Ваше фото (должно называться photo.jpg в репозитории) -->
            <img src="photo.jpg" alt="Tatiana Kalli" onerror="this.src='https://ui-avatars.com/api/?name=Tatiana+Kalli&background=0D8ABC&color=fff'" class="w-24 h-24 rounded-full mx-auto border-4 border-white shadow-lg object-cover -mt-12 mb-4 relative z-20">
            
            <h1 class="text-2xl font-bold text-gray-800 mb-1" id="name">Tatiana Kalli</h1>
            <p class="text-gray-600 text-sm mb-5" id="subtitle">Нотариальные и юридические услуги в Лимассоле</p>

            <!-- Услуги (Теги) -->
            <div class="flex flex-wrap justify-center gap-2 mb-6" id="services">
                <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Апостиль</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Доверенности</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Контракты</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Переводы</span>
                <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Сделки с недвижимостью</span>
            </div>

            <!-- Контакты -->
            <div class="space-y-3 mb-6 text-left">
                <a href="tel:+35799579863" class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition text-gray-700 text-sm border">
                    <span class="text-xl">📞</span> <span class="font-medium">+357 99 579 863</span>
                </a>
                <a href="mailto:tac3kalli@gmail.com" class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition text-gray-700 text-sm border">
                    <span class="text-xl">✉️</span> <span class="font-medium">tac3kalli@gmail.com</span>
                </a>
                
                <!-- Соцсети и мессенджеры -->
                <div class="flex justify-center gap-6 mt-5">
                    <a href="https://wa.me/35799579863" class="text-green-500 font-bold hover:scale-110 transition flex flex-col items-center"><span class="text-2xl">💬</span><span class="text-[10px] text-gray-500 mt-1">WhatsApp</span></a>
                    <a href="https://t.me/+35799579863" class="text-blue-500 font-bold hover:scale-110 transition flex flex-col items-center"><span class="text-2xl">✈️</span><span class="text-[10px] text-gray-500 mt-1">Telegram</span></a>
                    <a href="https://www.facebook.com/tatiana.kalli" class="text-blue-700 font-bold hover:scale-110 transition flex flex-col items-center"><span class="text-2xl">📘</span><span class="text-[10px] text-gray-500 mt-1">Facebook</span></a>
                </div>
            </div>

            <!-- QR Код -->
            <div class="border-t pt-6 mt-6 bg-gray-50 -mx-6 -mb-6 p-6">
                <p class="text-sm text-gray-600 mb-3 font-medium" id="qrText">Отсканируйте, чтобы сохранить контакт</p>
                <div class="bg-white p-2 rounded-xl inline-block shadow-sm mb-4">
                    <canvas id="qrcode"></canvas>
                </div>
                <button onclick="saveContact()" class="w-full bg-blue-600 text-white py-3 rounded-xl font-bold hover:bg-blue-700 transition shadow-lg" id="saveBtn">Сохранить в телефонную книгу</button>
            </div>
        </div>
    </div>

    <script>
        // Данные для QR-кода и скачивания (на латинице для надежности)
        const vCardData = 
            "BEGIN:VCARD\n" +
            "VERSION:3.0\n" +
            "N:Kalli;Tatiana;;;\n" +
            "FN:Tatiana Kalli\n" +
            "ORG:Notary & Legal Services Limassol\n" +
            "TEL;TYPE=CELL:+35799579863\n" +
            "EMAIL:tac3kalli@gmail.com\n" +
            "URL:https://www.facebook.com/tatiana.kalli\n" +
            "END:VCARD";

        // Генерация QR
        new QRious({
            element: document.getElementById('qrcode'),
            value: vCardData,
            size: 160,
            level: 'M'
        });

        // Словари для перевода
        const translations = {
            ru: {
                subtitle: "Нотариальные и юридические услуги в Лимассоле",
                qrText: "Отсканируйте, чтобы сохранить контакт",
                saveBtn: "Сохранить в телефонную книгу",
                services: `
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Апостиль</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Доверенности</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Справки и заявления</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Контракты</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Переводы</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Сделки с недвижимостью</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Регистрация брака</span>
                `
            },
            en: {
                subtitle: "Notarial and legal services in Limassol",
                qrText: "Scan to save contact",
                saveBtn: "Save to Phonebook",
                services: `
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Apostille</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Power of Attorney</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Certificates & Applications</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Contracts</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Translations</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Real Estate</span>
                    <span class="px-2 py-1 bg-blue-100 text-blue-800 text-xs rounded-full shadow-sm">Marriage Registration</span>
                `
            }
        };

        let currentLang = 'ru';
        document.getElementById('langToggle').addEventListener('click', () => {
            currentLang = currentLang === 'ru' ? 'en' : 'ru';
            document.getElementById('subtitle').innerText = translations[currentLang].subtitle;
            document.getElementById('qrText').innerText = translations[currentLang].qrText;
            document.getElementById('saveBtn').innerText = translations[currentLang].saveBtn;
            document.getElementById('services').innerHTML = translations[currentLang].services;
        });

        // Функция скачивания контакта по кнопке
        function saveContact() {
            const blob = new Blob([vCardData], { type: 'text/vcard;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Tatiana_Kalli.vcf';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
